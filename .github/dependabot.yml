version: 2

# One grouped PR per ecosystem per month, minor/patch only.
# ponytail: major upgrades are skipped; bump those by hand when you plan the migration.
updates:
  - package-ecosystem: "npm"
    directory: "/" # npm workspaces: root lockfile covers apps/ai-service and apps/web
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "nuget"
    directory: "/apps/backend"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: "pub"
    directory: "/apps/mobile"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pub:
        patterns: ["*"]
