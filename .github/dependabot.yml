version: 2
updates:
  # .NET Backend Dependencies
  - package-ecosystem: "nuget"
    directory: "/apps/backend/src"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    reviewers:
      - "security-team"
    assignees:
      - "security-team"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"

  # NestJS AI Service Dependencies
  - package-ecosystem: "npm"
    directory: "/apps/ai-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    reviewers:
      - "security-team"
    assignees:
      - "security-team"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"

  # Next.js Web App Dependencies
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    reviewers:
      - "security-team"
    assignees:
      - "security-team"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"

  # Flutter Mobile App Dependencies
  - package-ecosystem: "pub"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    reviewers:
      - "security-team"
    assignees:
      - "security-team"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"

  # GitHub Actions Dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    reviewers:
      - "security-team"
    labels:
      - "github-actions"
      - "security"
