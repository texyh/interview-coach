version: '3.8'

services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: aipa-ai-service-dev
    ports:
      - '3001:3001'
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
    environment:
      - NODE_ENV=development
      - PORT=3001
      - LOG_LEVEL=debug
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-3.5-turbo
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001
    env_file:
      - .env
    networks:
      - aipa-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health/liveness']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ai-service-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: aipa-ai-service-prod
    ports:
      - '3001:3001'
    volumes:
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LOG_LEVEL=info
    env_file:
      - .env
    networks:
      - aipa-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health/liveness']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - production

networks:
  aipa-network:
    driver: bridge

volumes:
  logs:
    driver: local
