sonar.projectKey=aipa-platform
sonar.organization=aipa-org
sonar.projectName=AIPA Interview Preparation Platform

# Source code directories
sonar.sources=aipa-backend/src/,aipa-ai-service/src/,aipa-web-app/src/
sonar.tests=aipa-backend/tests/,aipa-ai-service/test/,aipa-web-app/__tests__/

# Exclusions
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/dist/**,**/build/**,**/*.min.js,**/*.min.css,**/coverage/**,**/.next/**,**/out/**

# Test exclusions
sonar.test.exclusions=**/node_modules/**,**/bin/**,**/obj/**

# Coverage reports
sonar.javascript.lcov.reportPaths=aipa-ai-service/coverage/lcov.info,aipa-web-app/coverage/lcov.info
sonar.cs.opencover.reportsPaths=aipa-backend/tests/coverage/coverage.opencover.xml

# Language-specific settings
sonar.typescript.node.maxspace=4096

# Security-specific rules
sonar.security.hotspots.sensitivity=high
sonar.security.review.priority=high

# Quality gates
sonar.qualitygate.wait=true

# Duplication detection
sonar.cpd.cross_project=true

# Issue assignment
sonar.issue.assignee.login=security-team

# Branch analysis
sonar.branch.name=${SYSTEM_PULLREQUEST_SOURCEBRANCH}
sonar.branch.target=${SYSTEM_PULLREQUEST_TARGETBRANCH}

# Pull request analysis
sonar.pullrequest.key=${SYSTEM_PULLREQUEST_PULLREQUESTNUMBER}
sonar.pullrequest.branch=${SYSTEM_PULLREQUEST_SOURCEBRANCH}
sonar.pullrequest.base=${SYSTEM_PULLREQUEST_TARGETBRANCH}
