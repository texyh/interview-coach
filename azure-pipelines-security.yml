# Azure DevOps Pipeline for Security Scanning and CI/CD
# Comprehensive security scanning for AIPA platform

trigger:
  branches:
    include:
    - main
    - develop
    - feature/*
  paths:
    include:
    - aipa-backend/*
    - aipa-ai-service/*
    - aipa-web-app/*
    - aipa-mobile-app/*

pr:
  branches:
    include:
    - main
    - develop

variables:
  - group: aipa-security-variables
  - name: BuildConfiguration
    value: 'Release'
  - name: DotNetVersion
    value: '9.0.x'
  - name: NodeVersion
    value: '20.x'

stages:
- stage: SecurityScanning
  displayName: 'Security Scanning & Analysis'
  jobs:
  - job: DependencyScanning
    displayName: 'Dependency Vulnerability Scanning'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: 'Setup .NET SDK'
      inputs:
        packageType: 'sdk'
        version: $(DotNetVersion)

    - task: NodeTool@0
      displayName: 'Setup Node.js'
      inputs:
        versionSpec: $(NodeVersion)

    # .NET Backend Security Scanning
    - task: DotNetCoreCLI@2
      displayName: 'Restore .NET Backend Dependencies'
      inputs:
        command: 'restore'
        projects: 'aipa-backend/src/**/*.csproj'

    - task: WhiteSource@21
      displayName: 'WhiteSource Security Scan - .NET Backend'
      inputs:
        cwd: 'aipa-backend'
        projectName: 'AIPA-Backend'
        scanType: 'unified-agent'
      continueOnError: false

    # Node.js Projects Security Scanning
    - task: Npm@1
      displayName: 'Install AI Service Dependencies'
      inputs:
        command: 'ci'
        workingDir: 'aipa-ai-service'

    - task: Npm@1
      displayName: 'Install Web App Dependencies'
      inputs:
        command: 'ci'
        workingDir: 'aipa-web-app'

    - task: WhiteSource@21
      displayName: 'WhiteSource Security Scan - AI Service'
      inputs:
        cwd: 'aipa-ai-service'
        projectName: 'AIPA-AI-Service'
        scanType: 'unified-agent'
      continueOnError: false

    - task: WhiteSource@21
      displayName: 'WhiteSource Security Scan - Web App'
      inputs:
        cwd: 'aipa-web-app'
        projectName: 'AIPA-Web-App'
        scanType: 'unified-agent'
      continueOnError: false

    # License Compliance Scanning
    - task: ComponentGovernanceComponentDetection@0
      displayName: 'Component Governance Detection'
      inputs:
        scanType: 'Register'
        verbosity: 'Verbose'
        alertWarningLevel: 'High'

  - job: StaticAnalysis
    displayName: 'Static Application Security Testing (SAST)'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: 'Setup .NET SDK'
      inputs:
        packageType: 'sdk'
        version: $(DotNetVersion)

    - task: NodeTool@0
      displayName: 'Setup Node.js'
      inputs:
        versionSpec: $(NodeVersion)

    # SonarCloud Analysis Setup
    - task: SonarCloudPrepare@1
      displayName: 'Prepare SonarCloud Analysis'
      inputs:
        SonarCloud: 'SonarCloud-Connection'
        organization: 'aipa-platform'
        scannerMode: 'MSBuild'
        projectKey: 'aipa-platform'
        projectName: 'AIPA Platform'
        extraProperties: |
          sonar.cs.analyzer.projectOutPaths=$(Agent.TempDirectory)
          sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/*.min.js,**/*.min.css
          sonar.test.exclusions=**/node_modules/**,**/test/**,**/tests/**,**/*.test.ts,**/*.spec.ts
          sonar.security.hotspots.sensitivity=high
          sonar.security.review.priority=high

    # Build .NET Backend
    - task: DotNetCoreCLI@2
      displayName: 'Build .NET Backend'
      inputs:
        command: 'build'
        projects: 'aipa-backend/src/**/*.csproj'
        arguments: '--configuration $(BuildConfiguration) --no-restore'

    # Build Node.js Projects
    - task: Npm@1
      displayName: 'Build AI Service'
      inputs:
        command: 'run'
        arguments: 'build'
        workingDir: 'aipa-ai-service'

    - task: Npm@1
      displayName: 'Build Web App'
      inputs:
        command: 'run'
        arguments: 'build'
        workingDir: 'aipa-web-app'

    # Run SonarCloud Analysis
    - task: SonarCloudAnalyze@1
      displayName: 'Run SonarCloud Analysis'

    - task: SonarCloudPublish@1
      displayName: 'Publish SonarCloud Results'
      inputs:
        pollingTimeoutSec: '300'

  - job: SecretScanning
    displayName: 'Secret Scanning'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self
      fetchDepth: 0

    # GitLeaks Secret Scanning
    - task: CmdLine@2
      displayName: 'Install GitLeaks'
      inputs:
        script: |
          wget https://github.com/zricethezav/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.0_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

    - task: CmdLine@2
      displayName: 'Run GitLeaks Secret Scan'
      inputs:
        script: |
          gitleaks detect --source . --verbose --report-format json --report-path gitleaks-report.json
      continueOnError: true

    - task: PublishTestResults@2
      displayName: 'Publish GitLeaks Results'
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'gitleaks-report.json'
        testRunTitle: 'GitLeaks Secret Scanning'
      condition: always()

- stage: CodeQuality
  displayName: 'Code Quality & Security Testing'
  dependsOn: SecurityScanning
  condition: succeeded()
  jobs:
  - job: LintingSecurity
    displayName: 'Security-focused Linting'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: 'Setup Node.js'
      inputs:
        versionSpec: $(NodeVersion)

    # ESLint Security Plugin for Node.js Projects
    - task: Npm@1
      displayName: 'Install ESLint Security Plugin - AI Service'
      inputs:
        command: 'install'
        arguments: 'eslint-plugin-security --save-dev'
        workingDir: 'aipa-ai-service'

    - task: Npm@1
      displayName: 'Run Security Linting - AI Service'
      inputs:
        command: 'run'
        arguments: 'lint:security'
        workingDir: 'aipa-ai-service'
      continueOnError: true

    - task: Npm@1
      displayName: 'Install ESLint Security Plugin - Web App'
      inputs:
        command: 'install'
        arguments: 'eslint-plugin-security --save-dev'
        workingDir: 'aipa-web-app'

    - task: Npm@1
      displayName: 'Run Security Linting - Web App'
      inputs:
        command: 'run'
        arguments: 'lint:security'
        workingDir: 'aipa-web-app'
      continueOnError: true

  - job: SecurityTesting
    displayName: 'Security Unit Testing'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self

    - task: UseDotNet@2
      displayName: 'Setup .NET SDK'
      inputs:
        packageType: 'sdk'
        version: $(DotNetVersion)

    - task: NodeTool@0
      displayName: 'Setup Node.js'
      inputs:
        versionSpec: $(NodeVersion)

    # Run Security-focused Unit Tests
    - task: DotNetCoreCLI@2
      displayName: 'Run .NET Security Tests'
      inputs:
        command: 'test'
        projects: 'aipa-backend/tests/**/*Security*.csproj'
        arguments: '--configuration $(BuildConfiguration) --logger trx --collect "XPlat Code Coverage" --results-directory $(Agent.TempDirectory)'

    - task: Npm@1
      displayName: 'Run Node.js Security Tests - AI Service'
      inputs:
        command: 'run'
        arguments: 'test:security'
        workingDir: 'aipa-ai-service'
      continueOnError: true

    - task: Npm@1
      displayName: 'Run Node.js Security Tests - Web App'
      inputs:
        command: 'run'
        arguments: 'test:security'
        workingDir: 'aipa-web-app'
      continueOnError: true

    - task: PublishTestResults@2
      displayName: 'Publish Security Test Results'
      inputs:
        testResultsFormat: 'VSTest'
        testResultsFiles: '$(Agent.TempDirectory)/**/*.trx'
      condition: always()

- stage: SecurityReporting
  displayName: 'Security Reporting & Compliance'
  dependsOn:
  - SecurityScanning
  - CodeQuality
  condition: always()
  jobs:
  - job: ComplianceReport
    displayName: 'Generate Security Compliance Report'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - checkout: self

    - task: PowerShell@2
      displayName: 'Generate Security Summary Report'
      inputs:
        targetType: 'inline'
        script: |
          $report = @"
          # AIPA Platform Security Scan Summary

          **Build ID**: $(Build.BuildId)
          **Build Number**: $(Build.BuildNumber)
          **Date**: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')

          ## Scanned Components
          - .NET Backend (aipa-backend)
          - NestJS AI Service (aipa-ai-service)
          - Next.js Web App (aipa-web-app)
          - Flutter Mobile App (aipa-mobile-app)

          ## Security Checks Performed
          - [x] Dependency vulnerability scanning (WhiteSource)
          - [x] Static application security testing (SonarCloud)
          - [x] Secret scanning (GitLeaks)
          - [x] License compliance checking
          - [x] Security-focused linting
          - [x] Security unit testing

          ## Compliance Status
          Generated on: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
          Pipeline: $(Build.DefinitionName)
          "@

          $report | Out-File -FilePath "$(Build.ArtifactStagingDirectory)/security-report.md" -Encoding UTF8
          Write-Host "Security report generated successfully"

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Security Report'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'security-reports'
        publishLocation: 'Container'
